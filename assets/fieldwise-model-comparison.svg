<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">Fieldwise classifier comparison</title><desc id="desc">Mean accuracy from five-fold cross-validation on training data before tuning. Random forest led the six classifiers.</desc>
<rect width="760" height="310" rx="14" fill="#102c32"/><g font-family="system-ui,sans-serif" fill="#f5faf8"><text x="28" y="38" font-weight="700" font-size="23">Which classifier ranked first?</text><text x="28" y="66" font-size="15" fill="#bfd8d5">Fieldwise · Mean five-fold accuracy before tuning</text><path d="M214 86v177" stroke="#426164"/><text x="214" y="288" text-anchor="middle" font-size="14" fill="#bfd8d5">94%</text><path d="M354 86v177" stroke="#426164"/><text x="354" y="288" text-anchor="middle" font-size="14" fill="#bfd8d5">96%</text><path d="M494 86v177" stroke="#426164"/><text x="494" y="288" text-anchor="middle" font-size="14" fill="#bfd8d5">98%</text><path d="M634 86v177" stroke="#426164"/><text x="634" y="288" text-anchor="middle" font-size="14" fill="#bfd8d5">100%</text><text x="28" y="108" font-size="16">Random Forest</text><circle cx="530.59" cy="103" r="6" fill="#d4ee83"/><text x="724" y="108" text-anchor="end" font-size="16" fill="#d4ee83">98.52%</text><text x="28" y="138" font-size="16">Naive Bayes</text><circle cx="478.89" cy="133" r="6" fill="#add2d0"/><text x="724" y="138" text-anchor="end" font-size="16" fill="#dcf0ed">97.78%</text><text x="28" y="168" font-size="16">SVM</text><circle cx="407.30" cy="163" r="6" fill="#add2d0"/><text x="724" y="168" text-anchor="end" font-size="16" fill="#dcf0ed">96.76%</text><text x="28" y="198" font-size="16">KNN</text><circle cx="355.59" cy="193" r="6" fill="#add2d0"/><text x="724" y="198" text-anchor="end" font-size="16" fill="#dcf0ed">96.02%</text><text x="28" y="228" font-size="16">Decision Tree</text><circle cx="319.80" cy="223" r="6" fill="#add2d0"/><text x="724" y="228" text-anchor="end" font-size="16" fill="#dcf0ed">95.51%</text><text x="28" y="258" font-size="16">Logistic Regression</text><circle cx="232.30" cy="253" r="6" fill="#add2d0"/><text x="724" y="258" text-anchor="end" font-size="16" fill="#dcf0ed">94.26%</text></g></svg>
